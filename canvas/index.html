<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pizarra de lección / Lesson board</title>
  <!-- Design system: relative link, works from file:// and from any static host that serves the repo root (design-system/ stays a sibling of canvas/). -->
  <link rel="stylesheet" href="../design-system/styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="cv-body">
<div class="cv-app" id="app" data-tool="pen">

  <!-- C1 First-run Overlay weather notice (AC4): informational, never a gate -->
  <section class="ds-banner cv-banner" id="c1-banner" role="region" aria-label="Aviso Overlay / Overlay notice">
    <span class="ic ic-info cv-banner__icon" aria-hidden="true"></span>
    <div class="ds-banner__text" id="c1-text">
      <span class="cv-banner__title" lang="es">Aviso Overlay <span lang="en" class="ds-banner__en">Overlay notice</span></span>
      <span class="cv-banner__copy" lang="es" data-bi="overlayBanner.text.es"></span>
      <span class="cv-banner__copy ds-banner__en" lang="en" data-bi="overlayBanner.text.en"></span>
    </div>
    <button type="button" class="ds-iconbtn ds-iconbtn--board cv-banner__peek" id="btn-banner-toggle" aria-expanded="false" aria-label="Ver aviso / Show notice">
      <span class="ic ic-chevron-down" aria-hidden="true"></span>
    </button>
    <button type="button" class="ds-btn ds-btn--secondary ds-btn--board" id="btn-dismiss-banner">Entendido / Got it</button>
  </section>

  <main class="cv-board surface-board" id="board">

    <!-- Main canvas surface: objects (scene) + board ink -->
    <div class="cv-viewport" id="canvas-viewport">
      <div class="cv-scene" id="scene-layer"></div>
      <canvas class="cv-ink" id="ink-canvas"></canvas>
      <div class="cv-drop-veil" id="drop-veil" hidden></div>
    </div>

    <!-- C0 side rails (AC19): tools left, history/zoom/menu right; focus mode collapses both to edge tabs. -->
    <nav class="cv-rail" id="board-rail-left" data-rail="left" role="toolbar" aria-label="Herramientas y materiales / Tools and materials">
      <button type="button" class="ds-tool" data-tool="select" aria-pressed="false" title="Elegir / Select"><span class="ic ic-mouse-pointer-2" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Elegir</span><span lang="en" class="ds-tool__en">Select</span></button>
      <div class="cv-pen-wrap"><button type="button" class="ds-tool" data-tool="pen" aria-pressed="true" aria-haspopup="true" aria-expanded="false" title="Lápiz: toca otra vez para color y grosor / Pen: tap again for colour and thickness"><span class="ic ic-pen" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Lápiz</span><span lang="en" class="ds-tool__en">Pen</span></button><div class="cv-pen" data-pen-options role="group" aria-label="Lápiz: color y grosor / Pen: colour and thickness" hidden></div></div>
      <button type="button" class="ds-tool" data-tool="eraser" aria-pressed="false" title="Goma / Eraser"><span class="ic ic-eraser" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Goma</span><span lang="en" class="ds-tool__en">Eraser</span></button>
      <button type="button" class="ds-tool" data-tool="text" aria-pressed="false" title="Texto / Text"><span class="ic ic-type" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Texto</span><span lang="en" class="ds-tool__en">Text</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" data-act="add-sticky" title="Nota adhesiva / Sticky note"><span class="ic ic-sticky-note" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Nota</span><span lang="en" class="ds-tool__en">Note</span></button>
      <button type="button" class="ds-tool" data-act="add-image" title="Añadir imagen / Add image"><span class="ic ic-image" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Imagen</span><span lang="en" class="ds-tool__en">Image</span></button>
      <button type="button" class="ds-tool" data-act="add-pdf" title="Añadir PDF / Add PDF"><span class="ic ic-file-up" aria-hidden="true"></span><span class="ds-tool__es" lang="es">PDF</span><span lang="en" class="ds-tool__en">PDF</span></button>
      <button type="button" class="ds-tool" data-act="add-link" title="Añadir enlace / Add link"><span class="ic ic-link" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Enlace</span><span lang="en" class="ds-tool__en">Link</span></button>
      <button type="button" class="ds-tool" id="btn-add-webcard" title="Tarjeta web (v1.1) / Web card (v1.1)"><span class="ic ic-layout-grid" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Tarjeta</span><span lang="en" class="ds-tool__en">Web card</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-chip cv-chip cv-rail__chip" id="chip-overlay" data-overlay-chip aria-label="Overlay: cambiar estado / change state"><span class="ic ic-info" aria-hidden="true"></span><span class="cv-chip__label">Overlay ?</span></button>
    </nav>

    <nav class="cv-rail" id="board-rail-right" data-rail="right" role="toolbar" aria-label="Historial, zoom y archivo / History, zoom and file">
      <button type="button" class="ds-tool" id="btn-undo" title="Deshacer / Undo"><span class="ic ic-undo-2" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Deshacer</span><span lang="en" class="ds-tool__en">Undo</span></button>
      <button type="button" class="ds-tool" id="btn-redo" title="Rehacer / Redo"><span class="ic ic-redo-2" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Rehacer</span><span lang="en" class="ds-tool__en">Redo</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" id="btn-zoom-out" aria-label="Alejar / Zoom out" title="Alejar / Zoom out"><span class="ic ic-minus" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Alejar</span><span lang="en" class="ds-tool__en">Zoom out</span></button>
      <button type="button" class="ds-tool cv-rail__zoom" id="zoom-display" aria-label="Zoom: escribir porcentaje / type percentage" title="Zoom: escribir porcentaje / type percentage">100%</button>
      <input type="text" inputmode="numeric" class="ds-input ds-input--board cv-zoom-input" id="zoom-input" aria-label="Zoom %" hidden>
      <button type="button" class="ds-tool" id="btn-zoom-in" aria-label="Acercar / Zoom in" title="Acercar / Zoom in"><span class="ic ic-plus" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Acercar</span><span lang="en" class="ds-tool__en">Zoom in</span></button>
      <button type="button" class="ds-tool" id="btn-fit" aria-label="Ajustar / Fit" title="Ajustar / Fit"><span class="ic ic-maximize" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Ajustar</span><span lang="en" class="ds-tool__en">Fit</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" id="btn-clear-ink" title="Borrar tinta / Clear ink"><span class="ic ic-brush-cleaning" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Borrar</span><span lang="en" class="ds-tool__en">Clear</span></button>
      <button type="button" class="ds-tool" id="btn-more" aria-haspopup="menu" aria-expanded="false" aria-controls="overflow-menu" aria-label="Más / More" title="Más / More"><span class="ic ic-ellipsis-vertical" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Más</span><span lang="en" class="ds-tool__en">More</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" data-act="focus-toggle" aria-pressed="false" title="Solo tablero / Board only" aria-label="Solo tablero / Board only"><span class="ic ic-chevron-right" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Foco</span><span lang="en" class="ds-tool__en">Focus</span></button>
    </nav>

    <button type="button" class="cv-edgetab cv-edgetab--left" data-edge-tab="left" aria-controls="board-rail-left" aria-expanded="false" aria-label="Mostrar herramientas / Show tools" title="Mostrar herramientas / Show tools" hidden><span class="ic ic-chevron-right" aria-hidden="true"></span></button>
    <button type="button" class="cv-edgetab cv-edgetab--right" data-edge-tab="right" aria-controls="board-rail-right" aria-expanded="false" aria-label="Mostrar opciones / Show options" title="Mostrar opciones / Show options" hidden><span class="ic ic-chevron-left" aria-hidden="true"></span></button>

    <!-- Overflow menu: save, open, clear board, settings -->
    <div class="cv-menu cv-menu--right" id="overflow-menu" role="menu" hidden>
      <button type="button" class="cv-menu__item" role="menuitem" id="menu-save" title="Guardar lección / Save lesson"><span class="ic ic-save" aria-hidden="true"></span><span class="ds-bi"><span class="ds-bi__es" lang="es">Guardar lección</span><span class="ds-bi__en" lang="en">Save lesson</span></span></button>
      <button type="button" class="cv-menu__item" role="menuitem" id="menu-open" title="Abrir lección / Open lesson"><span class="ic ic-folder-open" aria-hidden="true"></span><span class="ds-bi"><span class="ds-bi__es" lang="es">Abrir lección</span><span class="ds-bi__en" lang="en">Open lesson</span></span></button>
      <button type="button" class="cv-menu__item cv-menu__item--danger" role="menuitem" id="menu-clear-board" title="Borrar tablero / Clear board"><span class="ic ic-trash-2" aria-hidden="true"></span><span class="ds-bi"><span class="ds-bi__es" lang="es">Borrar tablero</span><span class="ds-bi__en" lang="en">Clear board</span></span></button>
      <button type="button" class="cv-menu__item" role="menuitem" id="menu-settings" title="Ajustes / Settings"><span class="ic ic-settings" aria-hidden="true"></span><span class="ds-bi"><span class="ds-bi__es" lang="es">Ajustes</span><span class="ds-bi__en" lang="en">Settings</span></span></button>
    </div>

    <!-- Status chips, bottom-left (DS layout rules) -->
    <div class="cv-status" role="group" aria-label="Estado / Status">
      <span class="ds-badge cv-badge" id="chip-active-tool">herramienta: lápiz / tool: pen</span>
      <span class="ds-badge ds-badge--warning cv-badge" id="chip-pen-touch">pen/touch: provisional</span>
      <span class="ds-badge ds-badge--info cv-badge" id="chip-unsaved" hidden>• sin guardar / unsaved</span>
      <span class="ds-badge ds-badge--success cv-badge" id="chip-wdk-status" hidden>WDK: GX</span>
    </div>

    <div class="cv-toasts" id="toasts" aria-live="polite"></div>
  </main>

  <!-- C3 PDF book viewer: native pages from the dropped file, never an iframe (AC8). Side rails, no bands (AC17). -->
  <div class="cv-pdf cv-screen" id="pdf-viewer-overlay" role="dialog" aria-modal="true" aria-label="Libro PDF / PDF book" hidden>
    <div class="cv-pdf__stage" id="pdf-stage">
      <div class="cv-pdf__spread" id="pdf-page-container">
        <div class="cv-pdf__page">
          <canvas class="cv-pdf__canvas"></canvas>
          <canvas class="cv-pdf__ink"></canvas>
        </div>
        <div class="cv-pdf__page" hidden>
          <canvas class="cv-pdf__canvas"></canvas>
          <canvas class="cv-pdf__ink"></canvas>
        </div>
        <div class="cv-pdf__msg" id="pdf-msg" role="status" hidden></div>
      </div>
    </div>

    <nav class="cv-rail" id="pdf-rail-left" data-rail="left" role="toolbar" aria-label="Herramientas del libro / Book tools">
      <button type="button" class="ds-tool" id="btn-pdf-close" aria-label="Volver al tablero / Back to board" title="Volver al tablero / Back to board"><span class="ic ic-arrow-left" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Tablero</span><span lang="en" class="ds-tool__en">Board</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" data-pdf-tool="select" aria-pressed="false" title="Elegir / Select"><span class="ic ic-mouse-pointer-2" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Elegir</span><span lang="en" class="ds-tool__en">Select</span></button>
      <div class="cv-pen-wrap"><button type="button" class="ds-tool" data-pdf-tool="pen" aria-pressed="true" aria-haspopup="true" aria-expanded="false" title="Lápiz: toca otra vez para color y grosor / Pen: tap again for colour and thickness"><span class="ic ic-pen" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Lápiz</span><span lang="en" class="ds-tool__en">Pen</span></button><div class="cv-pen" data-pen-options role="group" aria-label="Lápiz: color y grosor / Pen: colour and thickness" hidden></div></div>
      <button type="button" class="ds-tool" data-pdf-tool="eraser" aria-pressed="false" title="Goma / Eraser"><span class="ic ic-eraser" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Goma</span><span lang="en" class="ds-tool__en">Eraser</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" id="btn-pdf-undo" title="Deshacer / Undo"><span class="ic ic-undo-2" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Deshacer</span><span lang="en" class="ds-tool__en">Undo</span></button>
      <button type="button" class="ds-tool" id="btn-pdf-redo" title="Rehacer / Redo"><span class="ic ic-redo-2" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Rehacer</span><span lang="en" class="ds-tool__en">Redo</span></button>
      <button type="button" class="ds-tool" id="btn-pdf-clear" title="Borrar tinta / Clear ink"><span class="ic ic-brush-cleaning" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Borrar</span><span lang="en" class="ds-tool__en">Clear</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-chip cv-chip cv-rail__chip" data-overlay-chip aria-label="Overlay: cambiar estado / change state"><span class="ic ic-info" aria-hidden="true"></span><span class="cv-chip__label">Overlay ?</span></button>
    </nav>

    <nav class="cv-rail" id="pdf-rail-right" data-rail="right" role="toolbar" aria-label="Navegación y zoom / Navigation and zoom">
      <button type="button" class="ds-tool" id="btn-pdf-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="pdf-menu" aria-label="Más / More" title="Más / More"><span class="ic ic-ellipsis-vertical" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Más</span><span lang="en" class="ds-tool__en">More</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" id="btn-pdf-prev" aria-label="Página anterior / Previous page" title="Página anterior / Previous page"><span class="ic ic-chevron-left" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Anterior</span><span lang="en" class="ds-tool__en">Previous</span></button>
      <label class="cv-rail__page">
        <input type="text" inputmode="numeric" class="ds-input ds-input--board cv-pdf__page-input" id="pdf-page-input" aria-label="página / page" value="1">
        <span class="cv-pdf__count">/ <span id="pdf-total-pages">1</span></span>
      </label>
      <button type="button" class="ds-tool" id="btn-pdf-next" aria-label="Página siguiente / Next page" title="Página siguiente / Next page"><span class="ic ic-chevron-right" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Siguiente</span><span lang="en" class="ds-tool__en">Next</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" id="btn-pdf-zoom-out" aria-label="Alejar / Zoom out" title="Alejar / Zoom out"><span class="ic ic-minus" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Alejar</span><span lang="en" class="ds-tool__en">Zoom out</span></button>
      <button type="button" class="ds-tool" id="btn-pdf-zoom-in" aria-label="Acercar / Zoom in" title="Acercar / Zoom in"><span class="ic ic-plus" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Acercar</span><span lang="en" class="ds-tool__en">Zoom in</span></button>
      <button type="button" class="ds-tool" id="btn-pdf-fit" aria-label="Ajustar / Fit" title="Ajustar / Fit"><span class="ic ic-maximize" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Ajustar</span><span lang="en" class="ds-tool__en">Fit</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" data-act="focus-toggle" aria-pressed="false" title="Solo página / Page only" aria-label="Solo página / Page only"><span class="ic ic-chevron-right" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Foco</span><span lang="en" class="ds-tool__en">Focus</span></button>
    </nav>

    <button type="button" class="cv-edgetab cv-edgetab--left" data-edge-tab="left" aria-controls="pdf-rail-left" aria-expanded="false" aria-label="Mostrar herramientas / Show tools" title="Mostrar herramientas / Show tools" hidden><span class="ic ic-chevron-right" aria-hidden="true"></span></button>
    <button type="button" class="cv-edgetab cv-edgetab--right" data-edge-tab="right" aria-controls="pdf-rail-right" aria-expanded="false" aria-label="Mostrar opciones / Show options" title="Mostrar opciones / Show options" hidden><span class="ic ic-chevron-left" aria-hidden="true"></span></button>

    <!-- Overflow menu: title, one/two-page view, status, close -->
    <div class="cv-menu cv-menu--right" id="pdf-menu" role="menu" hidden>
      <h2 class="cv-menu__title" id="pdf-viewer-title"></h2>
      <button type="button" class="cv-menu__item" role="menuitemradio" aria-checked="true" aria-pressed="true" id="btn-pdf-view-1" title="Una página / One page"><span class="ic ic-file-text" aria-hidden="true"></span><span class="ds-bi"><span class="ds-bi__es" lang="es">Una página</span><span class="ds-bi__en" lang="en">One page</span></span></button>
      <button type="button" class="cv-menu__item" role="menuitemradio" aria-checked="false" aria-pressed="false" id="btn-pdf-view-2" title="Dos páginas / Two pages"><span class="ic ic-book-open" aria-hidden="true"></span><span class="ds-bi"><span class="ds-bi__es" lang="es">Dos páginas</span><span class="ds-bi__en" lang="en">Two pages</span></span></button>
      <p class="cv-menu__status" id="pdf-status-text" role="status"></p>
      <button type="button" class="cv-menu__item" role="menuitem" id="btn-pdf-close-book" title="Cerrar libro / Close book"><span class="ic ic-x" aria-hidden="true"></span><span class="ds-bi"><span class="ds-bi__es" lang="es">Cerrar libro</span><span class="ds-bi__en" lang="en">Close book</span></span></button>
    </div>
  </div>

  <!-- C7 Tarjeta web full-screen (AC18): opens only from the card's Pantalla completa button; never the book. -->
  <div class="cv-wv cv-screen" id="web-viewer-overlay" role="dialog" aria-modal="true" aria-label="Tarjeta web / Web page" hidden>
    <div class="cv-wv__stage" id="web-stage">
      <div class="cv-wv__frame" id="web-frame">
        <canvas class="cv-wv__ink" id="web-ink"></canvas>
      </div>
    </div>

    <nav class="cv-rail" id="web-rail-left" data-rail="left" role="toolbar" aria-label="Herramientas de anotación / Annotation tools">
      <button type="button" class="ds-tool" id="btn-web-close" aria-label="Volver al tablero / Back to board" title="Volver al tablero / Back to board"><span class="ic ic-arrow-left" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Tablero</span><span lang="en" class="ds-tool__en">Board</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" data-web-tool="select" aria-pressed="false" title="Elegir / Select"><span class="ic ic-mouse-pointer-2" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Elegir</span><span lang="en" class="ds-tool__en">Select</span></button>
      <div class="cv-pen-wrap"><button type="button" class="ds-tool" data-web-tool="pen" aria-pressed="true" aria-haspopup="true" aria-expanded="false" title="Lápiz: toca otra vez para color y grosor / Pen: tap again for colour and thickness"><span class="ic ic-pen" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Lápiz</span><span lang="en" class="ds-tool__en">Pen</span></button><div class="cv-pen" data-pen-options role="group" aria-label="Lápiz: color y grosor / Pen: colour and thickness" hidden></div></div>
      <button type="button" class="ds-tool" data-web-tool="eraser" aria-pressed="false" title="Goma / Eraser"><span class="ic ic-eraser" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Goma</span><span lang="en" class="ds-tool__en">Eraser</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" id="btn-web-undo" title="Deshacer / Undo"><span class="ic ic-undo-2" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Deshacer</span><span lang="en" class="ds-tool__en">Undo</span></button>
      <button type="button" class="ds-tool" id="btn-web-redo" title="Rehacer / Redo"><span class="ic ic-redo-2" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Rehacer</span><span lang="en" class="ds-tool__en">Redo</span></button>
      <button type="button" class="ds-tool" id="btn-web-clear" title="Borrar tinta / Clear ink"><span class="ic ic-brush-cleaning" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Borrar</span><span lang="en" class="ds-tool__en">Clear</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-chip cv-chip cv-rail__chip" data-overlay-chip aria-label="Overlay: cambiar estado / change state"><span class="ic ic-info" aria-hidden="true"></span><span class="cv-chip__label">Overlay ?</span></button>
    </nav>

    <nav class="cv-rail" id="web-rail-right" data-rail="right" role="toolbar" aria-label="Modo y zoom / Mode and zoom">
      <button type="button" class="ds-tool" id="btn-web-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="web-menu" aria-label="Más / More" title="Más / More"><span class="ic ic-ellipsis-vertical" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Más</span><span lang="en" class="ds-tool__en">More</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <div class="cv-rail__modes" role="radiogroup" aria-label="Modo de interacción / Interaction mode">
        <button type="button" class="ds-tool" role="radio" data-web-mode="frozen" aria-checked="true" aria-pressed="true" title="Fija: tinta nuestra, página quieta / Frozen: our ink, page still"><span class="ic ic-lock" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Fija</span><span lang="en" class="ds-tool__en">Frozen</span></button>
        <button type="button" class="ds-tool" role="radio" data-web-mode="interact" aria-checked="false" aria-pressed="false" title="Interactuar: tinta en pausa / Interact: ink paused"><span class="ic ic-hand" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Interac.</span><span lang="en" class="ds-tool__en">Interact</span></button>
      </div>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" id="btn-web-zoom-out" aria-label="Alejar / Zoom out" title="Alejar / Zoom out"><span class="ic ic-minus" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Alejar</span><span lang="en" class="ds-tool__en">Zoom out</span></button>
      <button type="button" class="ds-tool" id="btn-web-zoom-in" aria-label="Acercar / Zoom in" title="Acercar / Zoom in"><span class="ic ic-plus" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Acercar</span><span lang="en" class="ds-tool__en">Zoom in</span></button>
      <button type="button" class="ds-tool" id="btn-web-fit" aria-label="Ajustar / Fit" title="Ajustar / Fit"><span class="ic ic-maximize" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Ajustar</span><span lang="en" class="ds-tool__en">Fit</span></button>
      <span class="ds-dock__sep" role="separator"></span>
      <button type="button" class="ds-tool" data-act="focus-toggle" aria-pressed="false" title="Solo página / Page only" aria-label="Solo página / Page only"><span class="ic ic-chevron-right" aria-hidden="true"></span><span class="ds-tool__es" lang="es">Foco</span><span lang="en" class="ds-tool__en">Focus</span></button>
    </nav>

    <button type="button" class="cv-edgetab cv-edgetab--left" data-edge-tab="left" aria-controls="web-rail-left" aria-expanded="false" aria-label="Mostrar herramientas / Show tools" title="Mostrar herramientas / Show tools" hidden><span class="ic ic-chevron-right" aria-hidden="true"></span></button>
    <button type="button" class="cv-edgetab cv-edgetab--right" data-edge-tab="right" aria-controls="web-rail-right" aria-expanded="false" aria-label="Mostrar opciones / Show options" title="Mostrar opciones / Show options" hidden><span class="ic ic-chevron-left" aria-hidden="true"></span></button>

    <!-- Overflow menu: where this is, open in a tab (sites that refuse framing), reload, back -->
    <div class="cv-menu cv-menu--right" id="web-menu" role="menu" hidden>
      <h2 class="cv-menu__title" id="web-viewer-title"></h2>
      <p class="cv-menu__status" id="web-status-text" role="status"></p>
      <button type="button" class="cv-menu__item" role="menuitem" id="btn-web-open-tab" title="Abrir en pestaña / Open in new tab"><span class="ic ic-external-link" aria-hidden="true"></span><span class="ds-bi"><span class="ds-bi__es" lang="es">Abrir en pestaña</span><span class="ds-bi__en" lang="en">Open in new tab</span></span></button>
      <button type="button" class="cv-menu__item" role="menuitem" id="btn-web-reload" title="Recargar / Reload"><span class="ic ic-rotate-cw" aria-hidden="true"></span><span class="ds-bi"><span class="ds-bi__es" lang="es">Recargar</span><span class="ds-bi__en" lang="en">Reload</span></span></button>
      <button type="button" class="cv-menu__item" role="menuitem" id="btn-web-close-menu" title="Volver al tablero / Back to board"><span class="ic ic-x" aria-hidden="true"></span><span class="ds-bi"><span class="ds-bi__es" lang="es">Volver al tablero</span><span class="ds-bi__en" lang="en">Back to board</span></span></button>
    </div>
  </div>

  <!-- Dialogs (clear, load-replace, link, web card, settings) render here: DS Dialog markup -->
  <div class="ds-scrim" id="dialog-host" hidden></div>

  <!-- Hidden pickers -->
  <input type="file" id="lesson-file-input" accept=".json,application/json" hidden>
  <input type="file" id="pdf-file-input" accept="application/pdf,.pdf" multiple hidden>
  <input type="file" id="image-file-input" accept="image/*" multiple hidden>
  <input type="file" id="probe-file-input" accept=".json,application/json" hidden>
</div>

<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="canvas-core.js"></script>
<script src="app.js"></script>
</body>
