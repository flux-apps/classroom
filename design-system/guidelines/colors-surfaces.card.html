<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.sw{width:92px}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-line)}.sw b{display:block;font-size:12px;margin-top:4px}.sw span{font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--color-paper)"></i><b>paper</b><span>#FFFFFF</span></div><div class="sw"><i style="background:var(--color-canvas)"></i><b>canvas</b><span>#F6F4EF</span></div><div class="sw"><i style="background:var(--color-canvas-deep)"></i><b>canvas-deep</b><span>#ECE9E1</span></div><div class="sw"><i style="background:var(--color-line)"></i><b>line</b><span>#DDD9CE</span></div><div class="sw"><i style="background:var(--color-line-strong)"></i><b>line-strong</b><span>#BDB8AA</span></div><div class="sw"><i style="background:var(--color-lavender)"></i><b>lavender (notebook rule)</b><span>#B8BDD4</span></div></div></body></html>
