<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.sw{width:92px}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-line)}.sw b{display:block;font-size:12px;margin-top:4px}.sw span{font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--state-success)"></i><b>success</b><span>#188943</span></div><div class="sw"><i style="background:var(--state-warning)"></i><b>warning</b><span>#D96629</span></div><div class="sw"><i style="background:var(--state-error)"></i><b>error</b><span>#D2232A</span></div><div class="sw"><i style="background:var(--state-info)"></i><b>info</b><span>#0072BC</span></div><div class="sw"><i style="background:var(--color-yellow)"></i><b>highlight</b><span>#F8C703</span></div></div></body></html>
