<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.sw{width:92px}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-line)}.sw b{display:block;font-size:12px;margin-top:4px}.sw span{font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--sticky-yellow)"></i><b>yellow</b><span>#FFF9B8</span></div><div class="sw"><i style="background:var(--sticky-green)"></i><b>green</b><span>#EBF4DE</span></div><div class="sw"><i style="background:var(--sticky-teal)"></i><b>teal</b><span>#D6EEEA</span></div><div class="sw"><i style="background:var(--sticky-pink)"></i><b>pink</b><span>#F0CFD0</span></div><div class="sw"><i style="background:var(--sticky-lavender)"></i><b>lavender</b><span>mix 55%</span></div><div class="acc-orange sw"><i style="background:var(--accent-tint)"></i><b>accent-tint</b><span>accent 14% on white</span></div></div></body></html>
