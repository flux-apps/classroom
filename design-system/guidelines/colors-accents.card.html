<!-- @dsCard group="Colors" viewport="700x150" subtitle="Seven section accents, each with its own shape" name="Section accents" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.sw{width:92px}.sw i{display:block;height:56px;border-radius:8px;border:1px solid var(--color-line)}.sw b{display:block;font-size:12px;margin-top:4px}.sw span{font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--accent-lime)"></i><b>lime</b><span><span class="ds-mark ds-mark--cross" style="--accent:var(--accent-lime);width:12px;height:12px;vertical-align:-2px"></span> cross</span></div><div class="sw"><i style="background:var(--accent-green)"></i><b>green</b><span><span class="ds-mark ds-mark--circle" style="--accent:var(--accent-green);width:12px;height:12px;vertical-align:-2px"></span> circle</span></div><div class="sw"><i style="background:var(--accent-orange)"></i><b>orange</b><span><span class="ds-mark ds-mark--triangle" style="--accent:var(--accent-orange);width:12px;height:12px;vertical-align:-2px"></span> triangle</span></div><div class="sw"><i style="background:var(--accent-magenta)"></i><b>magenta</b><span><span class="ds-mark ds-mark--diamond" style="--accent:var(--accent-magenta);width:12px;height:12px;vertical-align:-2px"></span> diamond</span></div><div class="sw"><i style="background:var(--accent-blue)"></i><b>blue</b><span><span class="ds-mark ds-mark--square" style="--accent:var(--accent-blue);width:12px;height:12px;vertical-align:-2px"></span> square</span></div><div class="sw"><i style="background:var(--accent-purple)"></i><b>purple</b><span><span class="ds-mark ds-mark--hexagon" style="--accent:var(--accent-purple);width:12px;height:12px;vertical-align:-2px"></span> hexagon</span></div><div class="sw"><i style="background:var(--accent-teal)"></i><b>teal</b><span><span class="ds-mark ds-mark--pentagon" style="--accent:var(--accent-teal);width:12px;height:12px;vertical-align:-2px"></span> pentagon</span></div></div></body></html>
