<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; background: var(--color-paper); }
  body { padding: 14px 16px; color: var(--color-ink); font-family: var(--text-body-family); box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>

<div id="root"></div>
<script type="text/babel" data-presets="react">
  DS.mount('#root', { Bubble: './Bubble.jsx' }, (c) => (
    <div style={{display:'flex',gap:'18pt',alignItems:'center',background:'var(--color-teal-3)',padding:'12pt'}}>
