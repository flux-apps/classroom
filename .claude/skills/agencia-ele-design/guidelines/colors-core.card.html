<!-- @dsCard group="Colors" viewport="700x150" name="Core ink and text roles" subtitle="ink, paper, greys, example blue, steel blue" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--color-paper)}
  body{padding:12px 16px;box-sizing:border-box;color:var(--color-ink);font-family:var(--text-small-2-myriadpro-400-family);font-size:11px}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .sw{width:78px} .sw i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(35,31,32,.15)}
  .sw b{display:block;margin-top:3px;font-size:10.5px} .sw span{color:var(--color-slate);font-size:9.5px}
  h4{margin:0 0 6px;font-size:11px;color:var(--color-slate);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
</style></head><body>
<h4>Ink, paper, text roles (observed)</h4><div class="row"><div class="sw"><i style="background:var(--color-ink)"></i><b>ink</b><span>#231F20 body</span></div><div class="sw"><i style="background:var(--color-paper)"></i><b>paper</b><span>#FFFFFF</span></div><div class="sw"><i style="background:var(--color-grey)"></i><b>grey</b><span>#808285 credits</span></div><div class="sw"><i style="background:var(--color-slate)"></i><b>slate</b><span>#6D6E71 word box</span></div><div class="sw"><i style="background:var(--color-example-blue)"></i><b>example-blue</b><span>#0072BC examples</span></div><div class="sw"><i style="background:var(--color-steel-blue)"></i><b>steel-blue</b><span>#2F5C93 folio, rules</span></div><div class="sw"><i style="background:var(--color-lavender)"></i><b>lavender</b><span>#B8BDD4 unit label</span></div><div class="sw"><i style="background:var(--color-black)"></i><b>black</b><span>#000000 strokes</span></div></div>
</body></html>
