<!-- @dsCard group="Colors" viewport="700x150" name="Tints and fills" subtitle="pale fills behind boxes, notes and bubbles" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--color-paper)}
  body{padding:12px 16px;box-sizing:border-box;color:var(--color-ink);font-family:var(--text-small-2-myriadpro-400-family);font-size:11px}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .sw{width:78px} .sw i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(35,31,32,.15)}
  .sw b{display:block;margin-top:3px;font-size:10.5px} .sw span{color:var(--color-slate);font-size:9.5px}
  h4{margin:0 0 6px;font-size:11px;color:var(--color-slate);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
</style></head><body>
<h4>Tints and fills (observed)</h4><div class="row"><div class="sw"><i style="background:var(--color-teal-tint)"></i><b>teal-tint</b><span>#D6EEEA</span></div><div class="sw"><i style="background:var(--color-green-tint)"></i><b>green-tint</b><span>#EBF4DE</span></div><div class="sw"><i style="background:var(--color-red-tint)"></i><b>red-tint</b><span>#F0CFD0</span></div><div class="sw"><i style="background:var(--color-yellow-pale)"></i><b>yellow-pale</b><span>#FFF9B8</span></div><div class="sw"><i style="background:var(--color-yellow-3)"></i><b>yellow 3</b><span>#FBE091</span></div><div class="sw"><i style="background:var(--color-teal-3)"></i><b>teal 3</b><span>#A4C8D3</span></div><div class="sw"><i style="background:var(--color-teal-6)"></i><b>teal 6</b><span>#5BC6C9</span></div><div class="sw"><i style="background:var(--color-magenta-8)"></i><b>magenta 8</b><span>#F287B6</span></div></div>
</body></html>
